[project]
name = "legal_agent"
version = "0.1.0"
description = "A short description of my project."
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.12" # <-- ИСПРАВЛЕНО: используем ~ вместо ~
dependencies = [
    "faiss-cpu>=1.13.0",
    "groq>=0.35.0",
    "httpx[socks]>=0.28.1",
    "langchain>=1.0.8",
    "langchain-community>=0.3.16",
    "langchain-core>=0.3.29",
    "langchain-groq>=1.0.1",
    "langchain-huggingface>=0.1.2",
    "langchain-text-splitters>=0.3.5",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
]

[tool.uv]
# Configuration specific to uv can go here

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "black>=25.11.0",
    "commitizen>=4.10.0",
    "debugpy>=1.8.17",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
]
