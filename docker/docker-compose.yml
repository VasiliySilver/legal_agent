# Docker Compose для юридического агента
# PostgreSQL база данных

version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: legal_agent_postgres
    restart: unless-stopped
    
    environment:
      # Настройки PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-legal_agent}
      
      # Настройки локали для русского языка
      LANG: ru_RU.UTF-8
      LC_ALL: ru_RU.UTF-8
      
      # Настройки производительности
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    
    ports:
      # Проброс порта на хост (для подключения из приложения)
      - "${POSTGRES_PORT:-5432}:5432"
    
    volumes:
      # Персистентное хранилище данных
      - postgres_data:/var/lib/postgresql/data
      
      # Инициализационные скрипты (выполняются при первом запуске)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    
    networks:
      - legal_agent_network
    
    healthcheck:
      # Проверка здоровья БД
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Настройки ресурсов (опционально, для production)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 512M

# Volumes для персистентного хранения данных
volumes:
  postgres_data:
    driver: local
    name: legal_agent_postgres_data

# Сеть для коммуникации между контейнерами
networks:
  legal_agent_network:
    driver: bridge
    name: legal_agent_network
