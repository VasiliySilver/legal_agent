# Docker Compose для юридического агента
# PostgreSQL база данных

version: '3.8'

services:
  # PostgreSQL для основных данных (статьи, диалоги, пользователи)
  postgres:
    image: postgres:16-alpine
    container_name: legal_agent_postgres
    restart: unless-stopped

    environment:
      # Настройки PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-legal_agent}

      # Настройки локали для русского языка
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Настройки производительности
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    ports:
      # Проброс порта на хост
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Персистентное хранилище данных
      - postgres_data:/var/lib/postgresql/data

      # Инициализационные скрипты
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - legal_agent_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL с pgvector для векторного поиска
  postgres_vector:
    image: pgvector/pgvector:pg16
    container_name: legal_agent_postgres_vector
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${VECTOR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${VECTOR_DB_NAME:-legal_agent_vectors}

      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    ports:
      # Отдельный порт для векторной БД
      - "${VECTOR_DB_PORT:-5433}:5432"

    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
      - ./init_vector.sql:/docker-entrypoint-initdb.d/init_vector.sql

    networks:
      - legal_agent_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Volumes для персистентного хранения данных
volumes:
  postgres_data:
    driver: local
    name: legal_agent_postgres_data

  postgres_vector_data:
    driver: local
    name: legal_agent_postgres_vector_data

# Сеть для коммуникации между контейнерами
networks:
  legal_agent_network:
    driver: bridge
    name: legal_agent_network
